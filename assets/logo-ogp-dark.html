<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>testscales Logo OGP Dark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1280px;
      height: 640px;
      background: #080c14;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.14) 0%, rgba(14, 165, 233, 0.04) 40%, transparent 70%),
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.08), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.06), transparent 45%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* Elegant Cyber Grid */
    .grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at 50% 50%, black 50%, transparent 85%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 50%, transparent 85%);
    }

    /* Ambient Outer Glow */
    .glow-core {
      position: absolute;
      width: 650px;
      height: 320px;
      background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.28) 0%, rgba(129, 140, 248, 0.12) 45%, transparent 70%);
      filter: blur(65px);
      pointer-events: none;
      z-index: 1;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 48px;
      z-index: 2;
    }

    .logo-icon {
      width: 185px;
      height: 185px;
      filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.5));
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 15px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      width: fit-content;
      margin-bottom: 12px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }

    .logo-title {
      font-size: 104px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -3px;
      line-height: 1;
      display: flex;
      align-items: center;
      text-shadow: 0 6px 30px rgba(0, 0, 0, 0.6);
    }

    .logo-title .dot {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 21px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-tagline .pill {
      color: #38bdf8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow-core"></div>
  
  <div class="brand-container">
    <!-- Precision Scales & Test Strata Emblem -->
    <svg class="logo-icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Futuristic Neon Cyan-to-Gold Gradient -->
        <linearGradient id="beamGrad" x1="15" y1="25" x2="105" y2="40" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="50%" stop-color="#818cf8" />
          <stop offset="100%" stop-color="#fbbf24" />
        </linearGradient>

        <linearGradient id="cyanPan" x1="10" y1="50" x2="40" y2="80" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>

        <linearGradient id="goldPan" x1="80" y1="50" x2="110" y2="80" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#fde047" />
          <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>

        <linearGradient id="pillarGrad" x1="60" y1="20" x2="60" y2="105" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#e0e7ff" />
          <stop offset="40%" stop-color="#818cf8" />
          <stop offset="100%" stop-color="#38bdf8" />
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- Center Pivot Orb -->
      <circle cx="60" cy="22" r="6" fill="#ffffff" filter="url(#glow)" />

      <!-- Balanced Scale Beam -->
      <path d="M 20 32 C 40 26, 80 26, 100 32" stroke="url(#beamGrad)" stroke-width="7" stroke-linecap="round" />

      <!-- Vertical Spine -->
      <path d="M 60 26 L 60 68" stroke="url(#pillarGrad)" stroke-width="6" stroke-linecap="round" />
      
      <!-- Stepped Test Pyramid Foundation (Static, Unit, Integration, E2E) -->
      <path d="M 46 76 L 74 76" stroke="#818cf8" stroke-width="5" stroke-linecap="round" />
      <path d="M 38 88 L 82 88" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
      <path d="M 28 100 L 92 100" stroke="#0284c7" stroke-width="7" stroke-linecap="round" />

      <!-- Left Scale Pan (Hanging Strings + Curved Pan) -->
      <path d="M 23 35 L 14 58 L 34 58 Z" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" opacity="0.45" />
      <path d="M 9 60 C 9 75, 39 75, 39 60 Z" fill="url(#cyanPan)" />
      <!-- Left Pan Core Light -->
      <ellipse cx="24" cy="62" rx="10" ry="2.5" fill="#bae6fd" opacity="0.8" />

      <!-- Right Scale Pan (Hanging Strings + Curved Pan) -->
      <path d="M 97 35 L 86 58 L 106 58 Z" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round" opacity="0.45" />
      <path d="M 81 60 C 81 75, 111 75, 111 60 Z" fill="url(#goldPan)" />
      <!-- Right Pan Core Light -->
      <ellipse cx="96" cy="62" rx="10" ry="2.5" fill="#fef08a" opacity="0.8" />
    </svg>

    <div class="brand-text">
      <div class="badge">⚖️ ZERO-CONFIG TEST WEIGHER</div>
      <div class="logo-title">testscales<span class="dot">.</span></div>
      <div class="logo-tagline">Weigh the soul & archetype of your tests</div>
    </div>
  </div>
</body>
</html>
