<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>testscales OGP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1280px;
      height: 640px;
      background: #0d1117;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.12), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.08), transparent 40%),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 60px 70px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .left {
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      width: fit-content;
    }
    h1 {
      font-size: 54px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -1px;
    }
    h1 span {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 19px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .stats {
      display: flex;
      gap: 24px;
      margin-top: 10px;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
    }
    .stat-val {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .stat-lbl {
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .right {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
    .preview-card {
      width: 610px;
      filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.65));
      border-radius: 12px;
      overflow: hidden;
      transform: perspective(1000px) rotateY(-4deg) rotateX(2deg);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .preview-card img {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="left">
    <div class="badge">⚖️ ZERO-CONFIG TEST WEIGHER</div>
    <h1>testscales<span>.</span></h1>
    <p>Weigh the soul and archetype of your test suite with divine precision.</p>
    <div class="stats">
      <div class="stat-item">
        <span class="stat-val">&lt; 1s ⚡</span>
        <span class="stat-lbl">50k+ Files</span>
      </div>
      <div class="stat-item">
        <span class="stat-val">Polyglot</span>
        <span class="stat-lbl">TS • Py • Go • Rb • PHP</span>
      </div>
      <div class="stat-item">
        <span class="stat-val">8 Archetypes</span>
        <span class="stat-lbl">Trophy • Pyramid • Void</span>
      </div>
    </div>
  </div>
  <div class="right">
    <div class="preview-card">
      <img src="./output-preview.png" alt="Testscales Output">
    </div>
  </div>
</body>
</html>
